server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    # The CSV import uploads files
    client_max_body_size 10m;

    # Docker's DNS server. The backend name is resolved per request (see below), so
    # this container starts even before the backend does.
    resolver 127.0.0.11 valid=10s;

    # /api/x -> http://api:8000/x, like proxy.conf.json in development.
    # "api" is the network alias of whichever backend is running (see compose.yaml).
    location /api/ {
        set $api http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
