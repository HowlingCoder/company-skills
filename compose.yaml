services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: skills
      POSTGRES_PASSWORD: skills
      POSTGRES_DB: skills
    ports:
      - "5433:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql (not .../data)
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skills -d skills"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
