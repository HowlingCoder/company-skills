<div class="has-navbar-fixed-top">
  <si-application-header>
    <si-header-brand>
      <a
        siHeaderLogo
        routerLink="/"
        class="d-none d-md-flex"
        aria-label="Skill Management home"
      ></a>
      <h1 class="application-name">Skill Management</h1>
    </si-header-brand>
    <si-header-actions>
      <button
        si-header-action-item
        type="button"
        [icon]="themeMode.isDark() ? 'element-sun' : 'element-cloudy-night'"
        (click)="themeMode.toggle()"
      >
        {{ themeMode.isDark() ? 'Switch to light mode' : 'Switch to dark mode' }}
      </button>
    </si-header-actions>
  </si-application-header>

  <main class="si-layout-main-padding">
    <router-outlet />
  </main>
</div>
