<input
  #input
  type="text"
  class="form-control"
  autocomplete="off"
  typeaheadOptionField="label"
  [id]="inputId()"
  [placeholder]="placeholder()"
  [attr.aria-label]="ariaLabel()"
  [siTypeahead]="source"
  [typeaheadMinLength]="minLength()"
  [typeaheadOptionsLimit]="0"
  [typeaheadAutoSelectIndex]="allowFreeText() ? -1 : 0"
  [typeaheadSkipSortingMatches]="true"
  [typeaheadWaitMs]="200"
  [typeaheadClearValueOnSelect]="true"
  [typeaheadScrollable]="true"
  (typeaheadOnSelect)="onSelect($event)"
  (keydown.enter)="onEnter(input)"
/>
@if (noMatch() && !allowFreeText()) {
  <p class="text-secondary mt-2 mb-0" role="status">No matching skill in the catalog.</p>
}
