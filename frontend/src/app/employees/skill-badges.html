<ng-template #badge let-skill>
  <span
    class="badge skill-badge"
    [class]="'skill-level-' + skill.proficiency_level"
    [class.skill-matched]="skill.matched"
    [class.skill-unmatched]="hasMatches() && !skill.matched"
    [style.--skill-hue]="hue(skill.name)"
  >
    {{ skill.name }} {{ skill.proficiency_level }}
    @if (skill.matched) {
      <span class="visually-hidden">(matches the search)</span>
    }
  </span>
</ng-template>

<div class="d-flex align-items-center gap-2">
  @for (skill of visible(); track skill.skill_id) {
    <ng-container [ngTemplateOutlet]="badge" [ngTemplateOutletContext]="{ $implicit: skill }" />
  }
  @if (overflow().length) {
    <button
      type="button"
      class="badge bg-default skill-overflow"
      siPopoverPlacement="bottom"
      [siPopover]="overflowSkills"
      [attr.aria-label]="
        'Show ' + overflow().length + (overflow().length === 1 ? ' more skill' : ' more skills')
      "
    >
      +{{ overflow().length }}
    </button>
  }
</div>

<ng-template #overflowSkills>
  <si-popover-body>
    <div class="d-flex flex-wrap gap-2">
      @for (skill of overflow(); track skill.skill_id) {
        <ng-container [ngTemplateOutlet]="badge" [ngTemplateOutletContext]="{ $implicit: skill }" />
      }
    </div>
  </si-popover-body>
</ng-template>
