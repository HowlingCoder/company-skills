<div>
  <div class="d-flex align-items-center justify-content-between mb-6">
    <h2 class="mb-0">Employees</h2>
    <div class="d-flex gap-4">
      <button
        type="button"
        class="btn btn-secondary"
        [disabled]="!selected().length"
        (click)="openAssign()"
      >
        Assign skill{{ selected().length ? ' (' + selected().length + ')' : '' }}
      </button>
      <button type="button" class="btn btn-primary" (click)="openImport()">Import CSV</button>
    </div>
  </div>

  <app-employee-filters [filter]="filter()" (filterChange)="applyFilter($event)" />

  @switch (state()) {
    @case ('loading') {
      <si-loading-spinner />
    }
    @case ('error') {
      <si-inline-notification
        severity="danger"
        heading="Employees could not be loaded"
        message="The server did not answer as expected. Please try again."
        [action]="retryAction"
      />
    }
    @case ('loaded') {
      @if (rows().length) {
        <ngx-datatable
          class="table-element"
          columnMode="flex"
          siDatatableInteraction
          selectionType="checkbox"
          [rows]="rows()"
          [rowIdentity]="rowIdentity"
          [loadingIndicator]="loading()"
          [selected]="selected()"
          (selectedChange)="selected.set($event)"
          [footerHeight]="0"
        >
          <ngx-datatable-column
            name="Name"
            prop="name"
            [flexGrow]="2"
            [checkboxable]="true"
            [headerCheckboxable]="true"
          />
          <ngx-datatable-column name="Email" prop="email" [flexGrow]="3" />
          <ngx-datatable-column name="Age" prop="age" [flexGrow]="1" />
          <ngx-datatable-column name="Skills" prop="skills" [sortable]="false" [flexGrow]="6">
            <ng-template let-skills="value" ngx-datatable-cell-template>
              <app-skill-badges [skills]="skills" />
            </ng-template>
          </ngx-datatable-column>
          <ngx-datatable-column [sortable]="false" [resizeable]="false" [flexGrow]="1">
            <ng-template ngx-datatable-header-template>
              <span class="visually-hidden">Actions</span>
            </ng-template>
            <ng-template let-row="row" ngx-datatable-cell-template>
              <button
                type="button"
                class="btn btn-circle btn-sm btn-tertiary element-edit"
                [attr.aria-label]="'Manage skills of ' + row.name"
                (click)="openSkills(row)"
              ></button>
            </ng-template>
          </ngx-datatable-column>
        </ngx-datatable>
      } @else if (filterActive()) {
        <si-empty-state
          icon="element-search"
          heading="No employees match"
          [content]="noMatchText()"
        >
          <button type="button" class="btn btn-secondary" (click)="resetFilter()">
            Reset filters
          </button>
        </si-empty-state>
      } @else {
        <si-empty-state
          icon="element-users"
          heading="No employees yet"
          content="Import a CSV file to add employees."
        >
          <button type="button" class="btn btn-secondary" (click)="openImport()">Import CSV</button>
        </si-empty-state>
      }
    }
  }
</div>
